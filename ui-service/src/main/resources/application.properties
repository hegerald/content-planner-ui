# ---------------------------------------------------------------------------
# Content Planner UI-Service (Backend-for-Frontend)
# Port 8080 – das Backend läuft auf 8081, Angular auf 4200
# ---------------------------------------------------------------------------
quarkus.application.name=content-planner-ui-service
quarkus.http.port=8080
quarkus.http.test-port=8090

# --- Downstream-Service: content-planner-backend -----------------------------
# In anderen Umgebungen über die Umgebungsvariable
# QUARKUS_REST_CLIENT_CONTENT_PLANNER_BACKEND_URL überschreiben.
quarkus.rest-client.content-planner-backend.url=http://localhost:8081
quarkus.rest-client.content-planner-backend.connect-timeout=2000
quarkus.rest-client.content-planner-backend.read-timeout=5000

# --- OpenAPI-Contract dieses Services ------------------------------------------
quarkus.smallrye-openapi.info-title=Content Planner UI API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Anzeige-optimierte Schnittstelle für Oberflächen. Enthält keine Business-Logik; alle Regeln prüft das Backend.
quarkus.smallrye-openapi.store-schema-directory=openapi
quarkus.swagger-ui.always-include=true

# --- CORS: nur nötig, wenn eine fremde Oberfläche direkt (ohne Proxy) zugreift ---
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:4200
