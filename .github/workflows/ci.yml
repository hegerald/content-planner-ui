name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ui-service:
    name: UI-Service (Quarkus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build und Tests
        run: ./mvnw -B verify
      - name: OpenAPI-Contract aktuell?
        run: git diff --exit-code -- openapi/ || (echo "::error::openapi/ ist veraltet – ./mvnw package ausführen und committen" && exit 1)

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test -- --watch=false
      - name: Build
        run: npm run build
