name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Jeder Job ruft dasselbe Skript wie lokal (Skill verify-all) für seinen Teil auf.
jobs:
  knowledge:
    name: Wissens-Bundle (Open Knowledge Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: OKF-Bundle prüfen
        run: node scripts/verify.mjs okf

  ui-service:
    name: UI-Service (Quarkus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build, Tests und Contract
        run: node scripts/verify.mjs ui-service

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installation, Tests und Build
        run: node scripts/verify.mjs frontend
